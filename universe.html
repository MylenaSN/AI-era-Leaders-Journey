<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Patron Loop Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="gate.css" />
</head>
<body>
  <script src="mentor-home-guard.js"></script>
  <main class="gate">
    <section class="gate-panel universe">
      <p class="gate-brand">patronloop</p>
      <h1>Patron Loop Universe</h1>
      <ul id="project-list" class="project-list"></ul>
    </section>
  </main>
  <script src="universe.js"></script>
  <script>
    var list = document.getElementById("project-list");
    (window.PATRON_PROJECTS || []).forEach(function (project) {
      var item = document.createElement("li");
      var link = document.createElement("a");
      link.className = "project-link";
      link.href = project.href;
      var title = document.createElement("strong");
      title.textContent = project.name;
      link.appendChild(title);
      if (project.note) {
        var note = document.createElement("span");
        note.textContent = project.note;
        link.appendChild(note);
      }
      item.appendChild(link);
      list.appendChild(item);
    });
  </script>
</body>
</html>
