<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mentor · Agile School Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --purple: #5B2D8E;
      --ink: #1f364b;
      --dim: #666;
      --line: #e6e6e6;
      --bg: #f4f4f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Roboto, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(91,45,142,0.12), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(43,192,180,0.10), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px 24px;
      box-shadow: 0 16px 40px rgba(31,54,75,0.08);
    }
    h1 {
      margin: 0 0 6px;
      font-family: Montserrat, sans-serif;
      font-size: 1.25rem;
      color: var(--purple);
    }
    .sub { margin: 0 0 20px; color: var(--dim); font-size: 0.9rem; line-height: 1.45; }
    label { display: block; font-size: 0.78rem; font-weight: 600; margin: 14px 0 6px; }
    select, input[type="password"], input[type="text"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }
    .hint { font-size: 0.75rem; color: var(--dim); margin-top: 6px; line-height: 1.4; }
    button {
      margin-top: 18px;
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--purple);
      color: #fff;
      font-family: Montserrat, sans-serif;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { color: #c83e74; font-size: 0.82rem; margin-top: 10px; min-height: 1.2em; }
    .foot { margin-top: 16px; font-size: 0.72rem; color: var(--dim); }
  </style>
</head>
<body>
  <script src="mentor-home-guard.js"></script>
  <form class="card" id="login-form">
    <h1>Login mentor</h1>
    <p class="sub">Escolha a trilha isolada. O PAT fica só nesta sessão do browser (nunca no git).</p>

    <label for="trilha">Trilha</label>
    <select id="trilha" required></select>

    <label for="pat">Token Gitea (contents: write no repo da mentora)</label>
    <input id="pat" type="password" autocomplete="off" spellcheck="false" placeholder="token Gitea — nunca GitHub" required />
    <p class="hint">Token de <strong>gitea.com</strong> no repo da mentora. Owner/repo em <code>mentor-config.js</code>. PAT GitHub é recusado.</p>

    <button type="submit" id="go">Entrar na mesa</button>
    <p class="err" id="err"></p>
    <p class="foot"><a href="../universe.html">Voltar ao Universe</a></p>
  </form>

  <script type="module">
    import {
      TRILHAS,
      writeSession,
      clearSession,
    } from "./game/js/mentor-config.js";

    const sel = document.getElementById("trilha");
    TRILHAS.forEach((t) => {
      const opt = document.createElement("option");
      opt.value = t.slug;
      opt.textContent = t.label + (t.reserved ? " (reservado)" : "") + " — " + t.mentor;
      sel.appendChild(opt);
    });

    document.getElementById("login-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const slug = sel.value;
      const token = document.getElementById("pat").value.trim();
      const trilha = TRILHAS.find((t) => t.slug === slug);
      if (!trilha) {
        err.textContent = "Trilha inválida.";
        return;
      }
      if (token.length < 20) {
        err.textContent = "Cole o token Gitea da sessão. Não fica no disco.";
        return;
      }
      if (/^(github_pat_|ghp_|gho_)/.test(token)) {
        err.textContent = "Este PAT é GitHub. A esteira final da mentora é Gitea.";
        return;
      }
      clearSession();
      writeSession({ slug, token, mentor: trilha.mentor });
      const onLive = /patronloop\.com$/i.test(location.hostname);
      let href;
      if (slug === "trilha-operations-leaders" && !onLive) {
        href = "play.html?mentor=1";
      } else {
        href = trilha.playPath + "?mentor=1";
      }
      location.href = href;
    });
  </script>
</body>
</html>
