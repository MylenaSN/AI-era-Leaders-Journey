<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AI-era Leaders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="gate.css" />
</head>
<body>
  <main id="gate" class="gate">
    <div class="gate-inner">
      <p class="gate-brand">AI-era Leaders</p>
      <button type="button" id="btn-enter" class="gate-cta">Entrar na jornada</button>
    </div>
    <dialog id="gate-dialog" class="gate-dialog">
      <form method="dialog" id="gate-form">
        <p class="gate-dialog-label">Human loop</p>
        <input type="password" id="gate-pass" autocomplete="current-password" placeholder="Senha" autofocus />
        <p id="gate-err" class="gate-err" hidden>Senha incorreta</p>
        <div class="gate-actions">
          <button type="button" id="gate-cancel" class="ghost">Voltar</button>
          <button type="submit" class="primary">Entrar</button>
        </div>
      </form>
    </dialog>
  </main>
  <script src="gate.js"></script>
</body>
</html>
